[project]
name = "app"
version = "0.1.0"
dependencies = [ "fastapi==0.115.6", "uvicorn==0.34.0", "sqlalchemy==2.0.36", "pydantic==2.10.4", "pydantic-settings==2.6.1", "email-validator==2.2.0", "eval-type-backport==0.2.2", "pyjwt==2.10.1", "python-multipart==0.0.20", "httpx==0.28.1", "pytest==8.3.4" ]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "index:app"
